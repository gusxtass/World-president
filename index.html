<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>WORLD PRESIDENT</title>
<meta name="theme-color" content="#0A0E17" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<style>
/* css/style.css */
:root {
  --bg: #0a0e17;
  --panel: #131a2a;
  --panel-alt: #1b2436;
  --border: #2a3550;
  --text: #e8eaf0;
  --text-dim: #8b93a7;
  --gold: #c9a24b;
  --cyan: #4fb7e8;
  --good: #4caf7d;
  --bad: #d9645f;
  --warn: #e0a840;
  --font-ui: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: var(--font-ui);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
#app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
button { font-family: inherit; cursor: pointer; }
input { font-family: inherit; }

/* ---------- tela de seleção ---------- */
#country-select-screen { flex: 1; overflow-y: auto; padding: 18px 14px 30px; }
.select-hero { text-align: center; margin-bottom: 18px; }
.select-title { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; color: var(--gold); }
.select-subtitle { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
.section-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-dim); margin: 18px 0 8px; }
.slot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.slot-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px;
  text-align: left; color: var(--text); font-size: 12px;
}
.slot-card.empty { color: var(--text-dim); }
.slot-title { font-weight: 600; margin-bottom: 4px; color: var(--gold); }
.slot-info { font-size: 12px; }
.slot-date { font-size: 10px; color: var(--text-dim); margin-top: 3px; }
.country-search {
  width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--panel); color: var(--text); font-size: 14px; margin-bottom: 10px;
}
.continent-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
.continent-tab {
  flex: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--panel); color: var(--text-dim); font-size: 12px; white-space: nowrap;
}
.continent-tab.active { background: var(--gold); color: #1a1305; border-color: var(--gold); font-weight: 600; }
.country-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.country-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px;
  text-align: left; color: var(--text); display: flex; flex-direction: column; gap: 3px;
}
.country-card:active { background: var(--panel-alt); }
.cc-flag { font-size: 20px; }
.cc-name { font-weight: 600; font-size: 13px; }
.cc-meta { font-size: 10px; color: var(--text-dim); font-family: var(--font-mono); }
.empty-note { color: var(--text-dim); font-size: 13px; padding: 10px 0; grid-column: 1 / -1; }

/* ---------- jogo: barra superior ---------- */
#game-screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#top-bar {
  background: linear-gradient(180deg, #101728, #0d1220);
  border-bottom: 1px solid var(--border); padding: 10px 14px 8px; flex: none;
}
.tb-row1 { display: flex; justify-content: space-between; align-items: center; }
.tb-country { display: flex; align-items: center; gap: 6px; }
.tb-flag { font-size: 18px; }
.tb-name { font-weight: 700; font-size: 14px; letter-spacing: 0.4px; }
.tb-role { font-size: 11px; color: var(--text-dim); }
.tb-stats { display: flex; justify-content: space-between; margin-top: 8px; }
.tb-stat { display: flex; flex-direction: column; align-items: center; flex: 1; }
.tb-label { font-size: 9px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.5px; }
.tb-value { font-family: var(--font-mono); font-size: 14px; font-weight: 600; }
.tb-value.tb-bad { color: var(--bad); }
.tb-value.tb-good { color: var(--good); }
.tb-time { display: flex; gap: 5px; margin-top: 9px; overflow-x: auto; }
.tb-timebtn {
  flex: none; background: var(--panel-alt); border: 1px solid var(--border); color: var(--text);
  border-radius: 8px; padding: 6px 10px; font-size: 11px; font-family: var(--font-mono);
}
.tb-timebtn:active { background: var(--gold); color: #1a1305; }
.tb-timebtn.playing { background: rgba(76,175,125,0.2); border-color: var(--good); color: var(--good); }

/* unidades militares */
.unit-row { background: var(--panel-alt); border-radius: 8px; padding: 9px 10px; margin-bottom: 8px; }
.unit-info { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.unit-icon { font-size: 16px; }
.unit-name { flex: 1; font-size: 12.5px; font-weight: 600; }
.unit-count { font-family: var(--font-mono); color: var(--cyan); font-size: 12.5px; }
.unit-buy { display: flex; gap: 6px; }
.unit-qty-input {
  width: 70px; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--panel); color: var(--text); font-size: 12px;
}
.btn-secondary.small.active { border-color: var(--gold); color: var(--gold); }
.build-row { margin-bottom: 10px; }
.build-benefit { margin-top: 2px; }

/* ---------- conteúdo ---------- */
#screen-content { flex: 1; overflow-y: auto; padding: 12px 12px 90px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.panel-title { font-size: 13px; font-weight: 700; color: var(--gold); margin-bottom: 10px; letter-spacing: 0.3px; }
.note { font-size: 11px; color: var(--text-dim); margin-top: 8px; line-height: 1.5; }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat-grid.two { grid-template-columns: 1fr 1fr; }
.stat-box { background: var(--panel-alt); border-radius: 8px; padding: 8px 10px; }
.stat-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; }
.stat-value { font-family: var(--font-mono); font-size: 16px; font-weight: 600; margin-top: 2px; }
.stat-value.tb-bad { color: var(--bad); }
.stat-value.tb-good { color: var(--good); }

.kv-grid { display: flex; flex-direction: column; gap: 7px; }
.kv { display: flex; justify-content: space-between; font-size: 12.5px; border-bottom: 1px dashed var(--border); padding-bottom: 6px; }
.kv-k { color: var(--text-dim); }
.kv-v { font-family: var(--font-mono); font-weight: 600; text-align: right; }
.kv-v.tb-bad { color: var(--bad); }
.kv-v.tb-good { color: var(--good); }

.chart-canvas { width: 100%; height: 150px; display: block; margin-top: 6px; border-radius: 8px; }
.chart-canvas.short { height: 200px; }
.chart-canvas.map { height: 190px; }
.chart-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 10px; color: var(--text-dim); margin-top: 6px; }
.map-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 10px; color: var(--text-dim); margin-top: 6px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.range-tabs { display: flex; gap: 6px; margin-bottom: 4px; }
.range-btn { background: var(--panel-alt); border: 1px solid var(--border); color: var(--text-dim); border-radius: 6px; padding: 3px 9px; font-size: 11px; }
.range-btn.active { background: var(--cyan); color: #04202e; border-color: var(--cyan); font-weight: 700; }

.news-list { display: flex; flex-direction: column; gap: 7px; }
.news-item { font-size: 12px; background: var(--panel-alt); border-radius: 8px; padding: 8px 10px; line-height: 1.4; }

.save-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }

/* botões */
.btn-primary, .btn-secondary, .btn-ghost, .btn-danger {
  border-radius: 10px; padding: 11px 14px; font-size: 13px; font-weight: 600; border: 1px solid transparent; width: 100%;
}
.btn-primary { background: var(--gold); color: #1a1305; margin-top: 6px; }
.btn-secondary { background: var(--panel-alt); color: var(--text); border-color: var(--border); }
.btn-secondary.small { width: auto; padding: 8px 11px; font-size: 12px; }
.btn-ghost { background: transparent; color: var(--text-dim); border-color: var(--border); margin-top: 8px; }
.btn-danger { background: rgba(217,100,95,0.15); color: var(--bad); border-color: var(--bad); }
.btn-danger.small { width: auto; padding: 8px 11px; font-size: 12px; }

/* sliders */
.slider-row { margin-bottom: 14px; }
.slider-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
.slider-val { font-family: var(--font-mono); color: var(--cyan); font-weight: 600; }
input[type="range"] {
  -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px; background: var(--border); outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--gold); border: 2px solid #1a1305; cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 50%; background: var(--gold); border: 2px solid #1a1305; cursor: pointer;
}
.apply-panel { border-color: var(--gold); }

/* partidos */
.party-row { margin-bottom: 12px; }
.party-head { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px; }
.party-name { font-weight: 600; }
.party-seat { font-family: var(--font-mono); color: var(--cyan); }
.party-bar { height: 6px; background: var(--panel-alt); border-radius: 3px; overflow: hidden; }
.party-bar-fill { height: 100%; background: var(--gold); }
.party-tag { font-size: 10px; color: var(--text-dim); margin-top: 3px; }

/* militar / tecnologia */
.branch-row { margin-bottom: 10px; }
.branch-name { font-size: 12px; margin-bottom: 4px; }
.branch-bars { display: flex; gap: 3px; }
.mini-bar { flex: 1; height: 6px; background: var(--panel-alt); border-radius: 3px; overflow: hidden; }
.mini-bar span { display: block; height: 100%; background: var(--text-dim); }
.mini-bar.train span { background: var(--cyan); }
.mini-bar.equip span { background: var(--gold); }
.mini-bar.morale span { background: var(--good); }
.mini-bar.tech { height: 8px; }
.mini-bar.tech span { background: var(--cyan); }
.tech-row { margin-bottom: 9px; }
.tech-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; font-family: var(--font-mono); }

/* mundo */
.world-list { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; max-height: 340px; overflow-y: auto; }
.world-row {
  display: flex; align-items: center; gap: 8px; background: var(--panel-alt); border: none;
  border-radius: 8px; padding: 9px 10px; color: var(--text); text-align: left;
}
.wr-flag { font-size: 16px; }
.wr-name { flex: 1; font-size: 12.5px; }
.wr-rel { font-size: 11px; font-weight: 600; }

/* ---------- navegação inferior ---------- */
#bottom-nav {
  flex: none; display: flex; background: #0d1220; border-top: 1px solid var(--border);
  padding: 6px 2px calc(6px + env(safe-area-inset-bottom));
}
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; color: var(--text-dim); padding: 4px 0; }
.nav-item.active { color: var(--gold); }
.nav-icon { font-size: 18px; }
.nav-label { font-size: 9px; }

/* ---------- modais ---------- */
#modal-root { display: none; position: fixed; inset: 0; z-index: 50; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; }
.modal-card {
  background: var(--panel); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0;
  width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; padding: 16px;
}
.modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 700; margin-bottom: 12px; }
.modal-close { background: none; border: none; color: var(--text-dim); font-size: 16px; }
.modal-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.decision-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.decision-card { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 10px; padding: 11px; text-align: left; color: var(--text); }
.decision-card:active { border-color: var(--gold); }
.decision-label { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
.decision-meta { font-size: 11px; color: var(--cyan); margin-bottom: 4px; }
.decision-effects { font-size: 11px; color: var(--text-dim); line-height: 1.4; }

/* ---------- toasts ---------- */
#toast-root { position: fixed; top: 10px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 80; pointer-events: none; }
.wp-toast {
  background: #1b2436; border: 1px solid var(--gold); color: var(--text); padding: 9px 14px; border-radius: 10px;
  font-size: 12.5px; opacity: 0; transform: translateY(-8px); transition: all 0.25s ease; max-width: 88%; text-align: center;
}
.wp-toast.show { opacity: 1; transform: translateY(0); }

@media (min-width: 720px) {
  #country-select-screen, #screen-content { max-width: 640px; margin: 0 auto; width: 100%; }
  #top-bar, #bottom-nav { max-width: 640px; margin: 0 auto; }
}

</style>
</head>

      <nav id="bottom-nav"></nav>

  function genParties(id, govType) {
    const rules = GOV_ELECTION_RULES[govType] || GOV_ELECTION_RULES.presidencialista;
    if (rules.noElections && (govType === "monarquia_absoluta" || govType === "militar")) return [];
    if (govType === "comunista") return [{ name: "Partido único", econLean: 5, socialLean: 25, seatShare: 1 }];
    const n = 3 + Math.floor(seededRand(id, "npartidos") * 2); // 3 ou 4 partidos
    const picks = [];
    const usedIdx = new Set();
    for (let i = 0; i < n; i++) {
      let idx = Math.floor(seededRand(id, "party" + i) * PARTY_LABELS.length);
      while (usedIdx.has(idx)) idx = (idx + 1) % PARTY_LABELS.length;
      usedIdx.add(idx);
      picks.push(idx);
    }
    const raws = picks.map((idx, i) => seededRand(id, "seat" + i) + 0.15);
    const sumRaw = raws.reduce((a, b) => a + b, 0);
    return picks.map((idx, i) => ({
      name: PARTY_LABELS[idx][0],
      econLean: clamp(PARTY_LABELS[idx][1] + (seededRand(id, "el" + i) - 0.5) * 20, -100, 100),
      socialLean: clamp(PARTY_LABELS[idx][2] + (seededRand(id, "sl" + i) - 0.5) * 20, -100, 100),

    return {
      soldados: { count: Math.max(200, Math.round(basePower * 5200 * popMult * jitter(id, "u_sold", 0.25))) },
      tanques: { count: Math.max(0, Math.round(basePower * 5.5 * popMult * jitter(id, "u_tank", 0.3))) },

      drones: { count: Math.max(0, Math.round(basePower * 2.8 * techMult * jitter(id, "u_dron", 0.35))) },
      aeronaves: { count: Math.max(0, Math.round(basePower * 2 * techMult * jitter(id, "u_air", 0.3))) },

      digital: { share: clamp((advanced ? 0.09 : 0.03) * jitter(id, "s_dig", 0.4), 0.005, 0.2) },

        unemployment: deep.unemployment != null ? deep.unemployment : clamp(0.08 * jitter(id, "unemp", 0.8), 0.02, 0.4),

    // js/engine/economy.js
// Modelo macroeconômico simplificado mas interligado: crescimento, inflação, desemprego,
// câmbio e comércio reagem uns aos outros e às escolhas fiscais/monetárias do jogador.
(function (root) {
  root.WP = root.WP || {};
  const Economy = (root.WP.Economy = {});

  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }
  Economy.clamp = clamp;

  // ctx: { atWar: bool, sanctioned: bool }
  Economy.monthlyTick = function (country, ctx) {
    ctx = ctx || {};
    const e = country.economy;
    const f = country.fiscal;
    const warPenalty = ctx.atWar ? 0.018 : 0;
    const sanctionsPenalty = ctx.sanctioned ? 0.012 : 0;

    const tech = country.technology.civilian;
    const techBonus = ((tech.computing + tech.ai + tech.energy) / 300) * 0.012;
    const buildingsGrowth = root.WP.Buildings ? root.WP.Buildings.growthContribution(country) : 0;
    const investmentRatio = e.investment / Math.max(0.01, e.gdp);
    const investmentGap = investmentRatio - 0.2;
    const realInterest = country.centralBank.policyRate - e.inflation;
    const stabilityEffect = ((country.stability - 50) / 50) * 0.012;
    const debtDrag = f.debtToGdp > 0.9 ? (f.debtToGdp - 0.9) * 0.012 : 0;
    const model = country.laws ? country.laws.modeloEconomico : "misto";
    const taxDragThreshold = model === "liberal" ? 0.68 : 0.55;
    const taxDrag = Math.max(0, f.taxRates.corporate + f.incomeBrackets.medium - taxDragThreshold) * 0.02;
    const modelGrowthBonus = model === "liberal" ? 0.003 : model === "nacionalista" ? 0.0015 : 0;

    let growthTarget =
      0.018 + techBonus + buildingsGrowth + modelGrowthBonus + investmentGap * 0.05 - realInterest * 0.3 + stabilityEffect - debtDrag - taxDrag - warPenalty - sanctionsPenalty;
    growthTarget = clamp(growthTarget, -0.18, 0.15);
    e.growth = clamp(e.growth + (growthTarget - e.growth) * 0.18 + (Math.random() - 0.5) * 0.004, -0.25, 0.2);

    e.gdp = Math.max(0.01, e.gdp * (1 + e.growth / 12));

    const demandPressure = (e.growth - 0.02) * 0.45;
    const importedInflation = Math.max(0, 1 - e.currency.exchangeRate) * 0.35;
    const rateEffect = -(country.centralBank.policyRate - 0.04) * 0.55;
    const tariffPassthrough = f.taxRates.importTariff * 0.06;
    let inflationTarget = 0.025 + demandPressure + importedInflation + rateEffect + tariffPassthrough;
    inflationTarget = clamp(inflationTarget, -0.03, 4.0);
    e.inflation = clamp(e.inflation + (inflationTarget - e.inflation) * 0.22 + (Math.random() - 0.5) * 0.003, -0.05, 6.0);

    if (country._unemploymentBase == null) country._unemploymentBase = e.unemployment;
    const growthGap = e.growth - 0.02;
    const laborReformBonus = country.laws && country.laws.reformaTrabalhista ? 0.018 : 0;
    const unemploymentTarget = clamp(country._unemploymentBase - growthGap * 0.6 - laborReformBonus, 0.01, 0.65);
    e.unemployment = clamp(e.unemployment + (unemploymentTarget - e.unemployment) * 0.15, 0.01, 0.65);

    const rateDiff = country.centralBank.policyRate - 0.04;
    const tradeBalanceRatio = (e.exports - e.imports) / Math.max(1, e.gdp);
    const fxPressure = rateDiff * 0.5 + tradeBalanceRatio * 0.6 - debtDrag * 0.6 - ((50 - country.stability) / 50) * 0.012;
    e.currency.exchangeRate = clamp(e.currency.exchangeRate * (1 + fxPressure * 0.05), 0.05, 6);
    e.currency.confidence = clamp(e.currency.confidence + fxPressure * 8 + (country.stability - 50) * 0.02, 3, 99);

    const competitiveness = clamp((1 / e.currency.exchangeRate) * (1 + (root.WP.Buildings ? root.WP.Buildings.tradeBonus(country) : 0)), 0.25, 4.5);
    e.exports = Math.max(0.01, e.gdp * 0.22 * competitiveness * (1 - Math.min(0.6, f.taxRates.exportTariff)));
    e.imports = Math.max(0.01, e.gdp * 0.22 * (1 / competitiveness) * (1 - Math.min(0.6, f.taxRates.importTariff * 1.4)));
    e.tradeBalance = e.exports - e.imports;

    e.consumption = e.gdp * clamp(0.58 + (0.1 - f.taxRates.vat) * 0.5, 0.32, 0.78);
    e.investment = e.gdp * clamp(0.2 + investmentGap * 0.3 - realInterest * 0.5, 0.04, 0.48);
    e.productivity = clamp(e.productivity * (1 + techBonus * 0.3), 20, 400);

    // população cresce sozinha com o tempo - mais rápido em países pobres (transição
    // demográfica), quase estagnado ou levemente negativo em países muito ricos.
    const gdpPerCapitaUsd = (e.gdp / Math.max(0.01, country.population)) * 1000;
    let popGrowthAnnual = clamp(0.028 - gdpPerCapitaUsd / 2200000, -0.006, 0.032);
    popGrowthAnnual *= clamp(country.stability / 70, 0.5, 1.15);
    country.population = Math.max(0.01, country.population * (1 + popGrowthAnnual / 12));
  };

  // Aplica um choque instantâneo (usado por eventos/crises/guerra)
  Economy.applyShock = function (country, { growth = 0, inflation = 0, unemployment = 0, confidence = 0 } = {}) {
    const e = country.economy;
    e.growth = clamp(e.growth + growth, -0.3, 0.25);
    e.inflation = clamp(e.inflation + inflation, -0.05, 8);
    e.unemployment = clamp(e.unemployment + unemployment, 0.01, 0.7);
    e.currency.confidence = clamp(e.currency.confidence + confidence, 2, 99);

    // js/engine/fiscal.js
// Impostos, orçamento, dívida/déficit e banco central. Nenhum valor "solto": receita e
// gasto vêm sempre de PIB x taxas/participações, e a dívida reage ao resultado mensal.
(function (root) {
  root.WP = root.WP || {};
  const Fiscal = (root.WP.Fiscal = {});
  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  Fiscal.computeRevenue = function (country) {
    const e = country.economy,
      t = country.fiscal.taxRates,
      br = country.fiscal.incomeBrackets;
    const cap = country.fiscal.taxCapacity != null ? country.fiscal.taxCapacity : 0.6;
    const laborBase = 0.4,
      capitalBase = 0.16;
    // faixas de renda: baixa (~45% da massa salarial), média (~35%), alta (~20%) - cada
    // uma com sua própria alíquota e seu próprio efeito de aprovação (ver politics.js)
    const incomeLow = e.gdp * laborBase * 0.45 * br.low * cap;
    const incomeMedium = e.gdp * laborBase * 0.35 * br.medium * cap;
    const incomeHigh = e.gdp * laborBase * 0.2 * br.high * cap;
    const income = incomeLow + incomeMedium + incomeHigh;
    const corporate = e.gdp * capitalBase * t.corporate * cap;
    const vat = e.consumption * t.vat * cap;
    const importT = e.imports * t.importTariff;
    const exportT = e.exports * t.exportTariff;
    const fuel = e.gdp * 0.04 * t.fuel * cap;
    const wealth = e.gdp * 1.0 * t.wealth * cap;
    const resourceRoyalties = e.gdp * 0.008 * Math.min(3, (country.resources || []).length);
    // receita direta de estatais de petróleo/gás - é assim que petroestados de fato se
    // financiam (por isso muitos têm imposto de renda zero), não é "imposto" convencional.
    const hasOilGas = (country.resources || []).some((r) => r === "petroleo" || r === "gas");
    const oilStateRevenue = hasOilGas ? e.gdp * (country.archetype === "petromonarquia" ? 0.14 : 0.05) : 0;
    const other = e.gdp * 0.005;
    return {
      income, incomeLow, incomeMedium, incomeHigh, corporate, vat, importT, exportT, fuel, wealth, resourceRoyalties, oilStateRevenue, other,
      total: income + corporate + vat + importT + exportT + fuel + wealth + resourceRoyalties + oilStateRevenue + other,
    };
  };

  Fiscal.computeSpending = function (country) {
    const gdp = country.economy.gdp;
    const cats = {};
    Object.keys(country.fiscal.spendingGdp).forEach((k) => (cats[k] = gdp * country.fiscal.spendingGdp[k]));
    const discretionaryTotal = Object.values(cats).reduce((a, b) => a + b, 0);
    const interest = gdp * country.fiscal.debtToGdp * country.fiscal.interestRateOnDebt;
    return { categories: cats, interest, discretionaryTotal, total: discretionaryTotal + interest };
  };

  Fiscal.totalGovSize = function (country) {

  };

  Fiscal.updateCentralBank = function (country) {
    const cb = country.centralBank,
      e = country.economy;

    const target = clamp(0.02 + 1.5 * (e.inflation - cb.inflationTarget) + 0.5 * (0.02 - e.growth), -0.02, 0.65);

        }

    // js/engine/war.js
// Força relativa calculada a partir de poder militar, logística, moral, tecnologia,
// economia e apoio político - não é "quem tem número maior vence".
(function (root) {
  root.WP = root.WP || {};
  const War = (root.WP.War = {});
  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  function sideStrength(state, ids) {
    return ids.reduce((sum, id) => {
      const c = state.countries[id];
      if (!c) return sum;
      const mil = c.military.powerIndex || root.WP.Military.powerIndex(c);
      const economySupport = Math.log10(Math.max(1, c.economy.gdp)) * 4;
      const politicalSupport = (c.approval / 100) * 8;
      const stabilityFactor = 0.5 + c.stability / 200;
      return sum + (mil + economySupport + politicalSupport) * stabilityFactor;
    }, 0);
  }

  War.declare = function (state, attackerId, defenderId) {
    if (root.WP.Diplomacy.isAtWarWith(state, attackerId, defenderId)) return null;
    const war = { id: "w" + Date.now(), attackers: [attackerId], defenders: [defenderId], startDate: state.time.year + "-" + state.time.month, warScore: 0, months: 0, active: true };
    state.wars.push(war);
    root.WP.Diplomacy.adjust(state, attackerId, defenderId, -160); // força para -100 (clamp interno)
    state.news.unshift("⚔ Guerra declarada: " + state.countries[attackerId].namePt + " x " + state.countries[defenderId].namePt);
    return war;
  };

  War.monthlyTick = function (state) {
    (state.wars || []).forEach((war) => {
      if (!war.active) return;
      war.months += 1;
      const atkStrength = sideStrength(state, war.attackers);
      const defStrength = sideStrength(state, war.defenders);
      const total = atkStrength + defStrength || 1;
      const monthlyShift = ((atkStrength - defStrength) / total) * 6 + (Math.random() - 0.5) * 3;
      war.warScore = clamp(war.warScore + monthlyShift, -100, 100);

      const bothSides = war.attackers.concat(war.defenders);
      bothSides.forEach((id) => {
        const c = state.countries[id];
        if (!c) return;
        const intensity = clamp(0.01 + war.months * 0.0004, 0.01, 0.05);
        root.WP.Economy.applyShock(c, { growth: -intensity, confidence: -0.5 });
        c.approval = clamp(c.approval - 0.3 - war.months * 0.02, 0, 100);
        c.stability = clamp(c.stability - 0.15, 0, 100);
      });

      const exhausted = war.attackers.concat(war.defenders).some((id) => state.countries[id] && state.countries[id].approval < 8);
      if (Math.abs(war.warScore) > 75 || war.months > 60 || exhausted) {
        War.endWar(state, war);
      }
    });
  };

  War.endWar = function (state, war) {
    war.active = false;
    const winners = war.warScore >= 15 ? war.attackers : war.warScore <= -15 ? war.defenders : null;
    const losers = winners ? (winners === war.attackers ? war.defenders : war.attackers) : null;
    if (winners) {
      winners.forEach((id) => { const c = state.countries[id]; if (c) { c.approval = clamp(c.approval + 6, 0, 100); } });
      losers.forEach((id) => { const c = state.countries[id]; if (c) { c.approval = clamp(c.approval - 8, 0, 100); c.stability = clamp(c.stability - 5, 0, 100); } });
      state.news.unshift("🏳 Guerra encerrada: vitória para " + winners.map((id) => state.countries[id].namePt).join(", "));
    } else {
      state.news.unshift("🏳 Guerra encerrada em impasse / cessar-fogo negociado.");
    }
    war.attackers.concat(war.defenders).forEach((a) => {
      war.attackers.concat(war.defenders).forEach((b) => {
        if (a !== b) root.WP.Diplomacy.adjust(state, a, b, 10);
      });
    });
  };

  War.negotiatePeace = function (state, warId) {
    const war = (state.wars || []).find((w) => w.id === warId && w.active);
    if (!war) return false;
    War.endWar(state, war);
    return true;
  };
})(typeof window !== "undefined" ? window : global);

// Cada país não-jogável toma decisões todo mês a partir do próprio estado (dívida,
// aprovação, ameaças percebidas) e do seu perfil gerado - nunca aleatório sem critério.
(function (root) {
  root.WP = root.WP || {};
  const AI = (root.WP.AI = {});
  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  function fiscalStep(country) {
    const f = country.fiscal;
    if (f.debtToGdp > 1.1 && country.stability < 60) {
      // austeridade: reduz levemente categorias discricionárias, sobe um pouco a arrecadação
      ["welfare", "infrastructure", "admin"].forEach((k) => {
        if (f.spendingGdp[k] > 0.004) f.spendingGdp[k] *= 0.995;
      });
      f.taxRates.vat = clamp(f.taxRates.vat + 0.0004, 0, 0.3);
    } else if (f.debtToGdp < 0.4 && country.approval < 40) {
      f.spendingGdp.welfare = Math.min(0.15, f.spendingGdp.welfare * 1.004);
    }
  }

  function militaryStep(state, country) {
    const rel = country.id === state.playerCountryId ? 0 : root.WP.Diplomacy.getValue(state, country.id, state.playerCountryId);
    const threat = clamp((-rel / 100) * country.aiProfile.aggression * 1.5, 0, 1);
    const target = clamp(0.008 + threat * 0.04 + country.aiProfile.aggression * 0.01, 0.002, 0.15);
    country.military.budgetShareOfGdp = country.military.budgetShareOfGdp + (target - country.military.budgetShareOfGdp) * 0.05;
  }

  function diplomacyStep(state, country) {
    if (country.id === state.playerCountryId) return;
    // reage a alianças formais: se um aliado formal está em guerra contra este país, relação piora
    (state.wars || []).forEach((w) => {
      if (!w.active) return;

// Orquestrador: liga fiscal -> economia -> política -> militar -> tecnologia -> IA ->
// diplomacia -> guerra -> eventos a cada mês. Nenhum sistema roda isolado.
(function (root) {
  root.WP = root.WP || {};
  const Engine = (root.WP.Engine = {});
  const D = root.WP.Data;

  Engine.GAME_START_YEAR = 2027;

  Engine.newGame = function (countryId) {
    const countries = D.buildAllCountries();
    const state = {
      version: 1,
      playerCountryId: countryId,
      time: { year: Engine.GAME_START_YEAR, month: 1, paused: true },
      countries,
      relations: {},
      treaties: [],
      wars: [],
      events: { active: [], log: [] },
      recentActions: [],
      news: ["🏛 Novo governo empossado em " + countries[countryId].namePt + "."],
      history: { years: [], months: [] },
    };
    return state;
  };

  function recordHistory(state) {
    const c = state.countries[state.playerCountryId];
    state.history.months.push({
      y: state.time.year, m: state.time.month,
      gdp: c.economy.gdp, growth: c.economy.growth, inflation: c.economy.inflation, unemployment: c.economy.unemployment,
      debtToGdp: c.fiscal.debtToGdp, approval: c.approval, stability: c.stability,
      militaryPower: c.military.powerIndex || 0, population: c.population,
    });
    if (state.history.months.length > 601) state.history.months.shift();
  }

  Engine.monthlyTick = function (state) {
    if (state.events.active.length > 0) return; // trava o tempo enquanto há decisão pendente
    const playerId = state.playerCountryId;

    Object.keys(state.countries).forEach((id) => {
      const c = state.countries[id];
      const atWar = (state.wars || []).some((w) => w.active && (w.attackers.includes(id) || w.defenders.includes(id)));
      const sanctioned = !!(c._sanctionedBy && c._sanctionedBy.length);
      root.WP.Fiscal.monthlyTick(c);
      root.WP.Economy.monthlyTick(c, { atWar, sanctioned });
      root.WP.Military.monthlyTick(c);
      root.WP.Technology.monthlyTick(c);
      root.WP.Buildings.monthlyTick(c);
      root.WP.Espionage.monthlyTick(c);
    });

    root.WP.AI.monthlyTick(state);
    root.WP.Diplomacy.monthlyTick(state);
    root.WP.War.monthlyTick(state);
    root.WP.Market.monthlyTick(state);

    Object.keys(state.countries).forEach((id) => {
      const c = state.countries[id];
      const atWar = (state.wars || []).some((w) => w.active && (w.attackers.includes(id) || w.defenders.includes(id)));
      let avgRelation = 0;
      if (id === playerId) {
        const keys = Object.keys(state.relations).filter((k) => k.split("_").includes(id));
        avgRelation = keys.length ? keys.reduce((s, k) => s + state.relations[k].value, 0) / keys.length : 0;
      }
      root.WP.Politics.monthlyTick(c, { atWar, avgRelation });
    });

    root.WP.Events.monthlyTick(state);

    // eleições: joga apenas para o jogador de forma "bloqueante"; para IA, resolve direto
    Object.keys(state.countries).forEach((id) => {
      const c = state.countries[id];
      if (c.government.noCompetitiveElections) return;
      if (id === playerId) return; // checado separadamente pela UI (precisa mostrar resultado)
      root.WP.Politics.checkElection(c);
    });

    recordHistory(state);

    state.time.month += 1;
    if (state.time.month > 12) {
      state.time.month = 1;
      state.time.year += 1;
    }
  };

  // Avança N meses; para automaticamente se um evento interativo aparecer ou se a eleição
  // do jogador chegar (para a UI poder mostrar o resultado). Retorna o motivo da parada.
  Engine.advance = function (state, months) {
    for (let i = 0; i < months; i++) {
      if (state.events.active.length > 0) return "evento";
      const playerCountry = state.countries[state.playerCountryId];
      if (!playerCountry.government.noCompetitiveElections && playerCountry.government.monthsUntilElection <= 1) {
        const result = root.WP.Politics.checkElection(playerCountry);
        if (result) {
          state.lastElectionResult = result;
          return result.won ? "eleicao_vitoria" : "eleicao_derrota";
        }
      }
      Engine.monthlyTick(state);
    }
    return "ok";
  };

// Salvamento local (localStorage) com múltiplos slots + autosave. Funciona 100% offline.
(function (root) {
  root.WP = root.WP || {};
  const Save = (root.WP.Save = {});
  const PREFIX = "wp_save_";

  function available() {
    try {
      return typeof localStorage !== "undefined" && localStorage !== null;
    } catch (e) {
      return false;
    }
  }
  Save.available = available;
  Save.SLOTS = ["slot1", "slot2", "slot3"];

  Save.save = function (state, slotId) {
    if (!available()) return false;
    try {
      localStorage.setItem(PREFIX + slotId, JSON.stringify(state));
      const player = state.countries[state.playerCountryId];
      localStorage.setItem(
        PREFIX + slotId + "_meta",
        JSON.stringify({
          countryId: state.playerCountryId, countryName: player.namePt, flag: player.flagEmoji,
          year: state.time.year, month: state.time.month, savedAt: Date.now(),
        })
      );
      return true;
    } catch (e) {
      console.error("Falha ao salvar:", e);
      return false;
    }
  };

  Save.load = function (slotId) {
    if (!available()) return null;
    const raw = localStorage.getItem(PREFIX + slotId);
    if (!raw) return null;
    try {
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  };

  Save.meta = function (slotId) {
    if (!available()) return null;
    const raw = localStorage.getItem(PREFIX + slotId + "_meta");
    if (!raw) return null;
    try {
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  };

  Save.delete = function (slotId) {
    if (!available()) return;
    localStorage.removeItem(PREFIX + slotId);
    localStorage.removeItem(PREFIX + slotId + "_meta");
  };

  Save.autosave = function (state) {
    Save.save(state, "auto");
  };
})(typeof window !== "undefined" ? window : global);

// Gráficos leves em <canvas>, sem dependências externas (o jogo precisa funcionar offline).
(function (root) {
  root.WP = root.WP || {};
  const Charts = (root.WP.Charts = {});

  function setupCanvas(canvas) {
    const dpr = root.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const w = rect.width || canvas.clientWidth || 300;
    const h = rect.height || canvas.clientHeight || 160;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w, h };
  }

  // series: [{ label, color, values: [n,...] }], labels: [string,...] (eixo X)
  Charts.drawLineChart = function (canvas, series, labels, opts) {
    opts = opts || {};
    const { ctx, w, h } = setupCanvas(canvas);
    ctx.clearRect(0, 0, w, h);
    const padL = opts.padLeft != null ? opts.padLeft : 38;
    const padR = 10, padT = 14, padB = 22;
    const plotW = w - padL - padR, plotH = h - padT - padB;

    let allValues = [];
    series.forEach((s) => (allValues = allValues.concat(s.values)));
    if (!allValues.length) return;
    let min = opts.min != null ? opts.min : Math.min(...allValues);
    let max = opts.max != null ? opts.max : Math.max(...allValues);
    if (min === max) { min -= 1; max += 1; }
    const margin = (max - min) * 0.1;
    min -= margin; max += margin;

    // gridlines horizontais
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.lineWidth = 1;
    ctx.font = "10px ui-monospace, 'SF Mono', 'Roboto Mono', monospace";
    ctx.fillStyle = "rgba(200,206,224,0.55)";
    const gridLines = 4;
    for (let i = 0; i <= gridLines; i++) {
      const y = padT + (plotH * i) / gridLines;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(w - padR, y);
      ctx.stroke();
      const val = max - ((max - min) * i) / gridLines;
      ctx.fillText(opts.formatY ? opts.formatY(val) : val.toFixed(1), 2, y + 3);
    }

    series.forEach((s) => {
      const n = s.values.length;
      if (n < 2) return;
      ctx.beginPath();
      s.values.forEach((v, i) => {
        const x = padL + (plotW * i) / (n - 1);
        const y = padT + plotH - ((v - min) / (max - min)) * plotH;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = s.color || "#4FB7E8";
      ctx.lineWidth = 2;
      ctx.stroke();
      // área sob a linha (leve)
      ctx.lineTo(padL + plotW, padT + plotH);
      ctx.lineTo(padL, padT + plotH);
      ctx.closePath();
      ctx.fillStyle = (s.color || "#4FB7E8") + "22";
      ctx.fill();
    });

    // eixo X: alguns rótulos
    if (labels && labels.length) {
      ctx.fillStyle = "rgba(200,206,224,0.55)";
      const stepCount = Math.min(labels.length, opts.maxXLabels || 5);
      for (let i = 0; i < stepCount; i++) {
        const idx = Math.round((i * (labels.length - 1)) / (stepCount - 1 || 1));
        const x = padL + (plotW * idx) / (labels.length - 1 || 1);
        ctx.fillText(labels[idx], Math.min(x - 10, w - padR - 24), h - 6);
      }
    }
  };

  // categories: [{label,value,color}]
  Charts.drawBarChart = function (canvas, categories, opts) {
    opts = opts || {};
    const { ctx, w, h } = setupCanvas(canvas);
    ctx.clearRect(0, 0, w, h);
    const padL = 4, padR = 4, padT = 10, padB = 10;
    const plotW = w - padL - padR;
    const barH = Math.min(22, (h - padT - padB) / categories.length - 6);
    const max = Math.max(...categories.map((c) => c.value), 0.001);

    categories.forEach((c, i) => {
      const y = padT + i * (barH + 6);
      const bw = (c.value / max) * (plotW * 0.62);
      ctx.fillStyle = "rgba(255,255,255,0.06)";
      ctx.fillRect(padL, y, plotW * 0.62, barH);
      ctx.fillStyle = c.color || "#C9A24B";
      ctx.fillRect(padL, y, bw, barH);
      ctx.font = "11px -apple-system, 'Segoe UI', sans-serif";
      ctx.fillStyle = "#E8EAF0";
      ctx.fillText(c.label, padL + plotW * 0.65, y + barH - 6);
    });
  };
})(typeof window !== "undefined" ? window : global);

    });
  };

  function renderCountryGrid(meta) {
    const grid = document.getElementById("country-grid");
    if (!grid) return;
    const term = UI.state.countryFilter.trim().toLowerCase();
    const filtered = meta.filter((c) => {
      const matchesContinent = UI.state.continentFilter === "Todos" || c.continent === UI.state.continentFilter;
      const matchesTerm = !term || c.namePt.toLowerCase().includes(term);
      return matchesContinent && matchesTerm;
    });
    grid.innerHTML = filtered.map((c) => `
      <button class="country-card" data-action="pick-country" data-id="${c.id}">
        <span class="cc-flag">${c.flagEmoji}</span>
        <span class="cc-name">${UI.esc(c.namePt)}</span>
        <span class="cc-meta">${UI.esc(c.capital)} · ${UI.fmtPop(c.population)} hab · ${UI.fmtMoney(c.gdp)}</span>
      </button>`).join("") || `<div class="empty-note">Nenhum país encontrado.</div>`;
  }

  document.addEventListener("click", function (e) {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.getAttribute("data-action");
    if (action === "filter-continent") {
      UI.state.continentFilter = el.getAttribute("data-continent");
      UI.renderSelectScreen();
    } else if (action === "pick-country") {
      const id = el.getAttribute("data-id");
      const meta = D.getCountryMeta().find((m) => m.id === id);
      if (confirm("Assumir a presidência de " + meta.namePt + "?")) UI.startNewGame(id);
    } else if (action === "load-slot") {
      UI.continueFromSlot(el.getAttribute("data-slot"));
    }
  });

  UI.wireLoadMenu = function () {};
})(typeof window !== "undefined" ? window : global);

          [
            { label: "Aprovação", color: "#C9A24B", values: months.map((m) => m.approval) },

          ],
          months.map((m) => m.m + "/" + String(m.y).slice(2)),

        else if (law === "trabalhista") c.laws.reformaTrabalhista = !c.laws.reformaTrabalhista;
        root.WP.Save.autosave(state);
        UI.toast(result.note);

        root.WP.Politics.setEconomicModel(c, el.getAttribute("data-model"));
        root.WP.Save.autosave(state);
        UI.rerender();
      } else if (action === "build-gov") {
        const key = el.getAttribute("data-key");
        const result = root.WP.Buildings.build(c, key);
        UI.toast(`${root.WP.Buildings.TYPES[key].label} agora no nível ${result.newLevel} (custou ${UI.fmtMoney(result.cost)}).`);
        root.WP.Save.autosave(state);
        UI.rerender();
      }
    },
  };
})(typeof window !== "undefined" ? window : global);

      if (action === "apply-economy") {
        const container = document.getElementById("screen-content");
        let approvedCount = 0, reducedCount = 0, rejectedCount = 0;

        BRACKET_FIELDS.forEach((field) => {
          const input = container.querySelector('[data-kind="bracket"][data-field="' + field.key + '"]');
          if (!input) return;
          const newVal = parseFloat(input.value);
          const oldVal = c.fiscal.incomeBrackets[field.key];
          const diff = newVal - oldVal;
          if (Math.abs(diff) < 0.0015) return;
          const leaning = diff > 0 ? -1 : 1;
          const result = Politics.evaluatePolicyChange(c, Math.abs(diff), leaning);
          if (!result.approved) { rejectedCount++; return; }
          const appliedDiff = diff * result.factor;
          c.fiscal.incomeBrackets[field.key] = oldVal + appliedDiff;
          Politics.applyBracketTaxChange(c, field.key, appliedDiff);
          root.WP.Events.logAction(state, "tax_hike_" + field.key, Math.max(0, appliedDiff));
          if (result.factor < 1) reducedCount++; else approvedCount++;
        });

        container.querySelectorAll('[data-kind="tax"]').forEach((input) => {
          const key = input.dataset.field;
          const newVal = parseFloat(input.value);
          const oldVal = c.fiscal.taxRates[key];
          const diff = newVal - oldVal;
          if (Math.abs(diff) < 0.0015) return;
          const leaning = diff > 0 ? -1 : 1;
          const result = Politics.evaluatePolicyChange(c, Math.abs(diff), leaning);
          if (!result.approved) { rejectedCount++; return; }
          c.fiscal.taxRates[key] = oldVal + diff * result.factor;
          if (result.factor < 1) reducedCount++; else approvedCount++;
        });

        SPEND_FIELDS.forEach((field) => {
          const input = container.querySelector('[data-kind="spend"][data-field="' + field.key + '"]');
          if (!input) return;
          const newVal = parseFloat(input.value);
          const oldVal = c.fiscal.spendingGdp[field.key];
          const diff = newVal - oldVal;
          if (Math.abs(diff) < 0.0015) return;
          if (field.leaning === 0) { c.fiscal.spendingGdp[field.key] = newVal; approvedCount++; return; }
          const leaning = field.leaning > 0 ? (diff > 0 ? 1 : -1) : diff > 0 ? -1 : 1;
          const result = Politics.evaluatePolicyChange(c, Math.abs(diff) * 2.5, leaning);
          if (!result.approved) { rejectedCount++; return; }
          c.fiscal.spendingGdp[field.key] = oldVal + diff * result.factor;
          if (diff < 0) root.WP.Events.logAction(state, "spending_cut", Math.abs(diff) * 3);
          if (result.factor < 1) reducedCount++; else approvedCount++;
        });

        const rateInput = container.querySelector('[data-field="policyRate"]');
        if (rateInput && !c.centralBank.independent) c.centralBank.policyRate = parseFloat(rateInput.value);

        root.WP.Save.autosave(state);
        UI.toast(`Aplicado: ${approvedCount} aprovada(s), ${reducedCount} reduzida(s), ${rejectedCount} rejeitada(s) pelo Congresso.`);
        UI.rerender();
      } else if (action === "nationalize") {
        const id = el.getAttribute("data-id");
        if (!confirm("Estatizar essa empresa? O custo é o valor de mercado dela.")) return;
        const result = root.WP.Companies.nationalize(state, c, id);
        if (!result.ok) { UI.toast(result.reason); return; }
        root.WP.Events.logAction(state, "nationalize", 1);
        root.WP.Save.autosave(state);
        UI.toast(`Estatizada por ${UI.fmtMoney(result.cost)}. Desempenho pós-estatização: ${(result.performanceModifier * 100).toFixed(0)}%.`);
        UI.rerender();
      } else if (action === "show-chart") {
        root.WP.UI.Modals.showInstrumentChart(state, el.getAttribute("data-id"), el.getAttribute("data-name"));
      } else if (action === "invest") {
        const id = el.getAttribute("data-id");
        const amount = parseFloat(prompt("Quanto investir (em bilhões USD)?", "1"));
        if (!amount || amount <= 0) return;
        const result = root.WP.Market.invest(state, id, amount);
        if (!result.ok) { UI.toast(result.reason); return; }
        root.WP.Save.autosave(state);
        UI.rerender();
      } else if (action === "divest") {
        const id = el.getAttribute("data-id");
        const result = root.WP.Market.divest(state, id, 1);
        if (!result.ok) { UI.toast(result.reason); return; }
        UI.toast("Vendido por " + UI.fmtMoney(result.proceeds) + ".");
        root.WP.Save.autosave(state);
        UI.rerender();
      } else if (action === "buy-bond") {
        const container = document.getElementById("screen-content");
        const input = container.querySelector("#bond-country");
        const code = input ? input.value.trim().toUpperCase() : "";
        if (!state.countries[code]) { UI.toast("Código de país inválido."); return; }
        const result = root.WP.Market.buyBond(state, code, 1);
        if (!result.ok) { UI.toast(result.reason); return; }
        root.WP.Save.autosave(state);
        UI.toast("Título comprado a " + (result.rate * 100).toFixed(1) + "%/ano.");
        UI.rerender();
      } else if (action === "redeem-bond") {
        const id = el.getAttribute("data-id");
        const result = root.WP.Market.redeemBond(state, id);
        if (!result.ok) { UI.toast(result.reason); return; }
        UI.toast("Resgatado: " + UI.fmtMoney(result.amount) + ".");
        root.WP.Save.autosave(state);
        UI.rerender();
      }
    },
  };
})(typeof window !== "undefined" ? window : global);

(function (root) {
  root.WP = root.WP || {};
  const UI = root.WP.UI;
  const Diplomacy = root.WP.Diplomacy;

  UI.worldState = { search: "", continent: "Todos", sort: "relacao" };

  function relColor(v) {
    if (v <= -70) return "#D9645F";
    if (v <= -35) return "#E0837F";
    if (v <= -10) return "#C98F7A";
    if (v < 15) return "#8B93A7";
    if (v < 45) return "#7FBF9E";
    if (v < 75) return "#4CAF7D";
    return "#C9A24B";
  }

  function project(lat, lon, w, h) {
    return { x: ((lon + 180) / 360) * w, y: ((90 - lat) / 180) * h };
  }

  function drawMap(canvas, state) {
    const dpr = root.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const w = rect.width || 340, h = 190;
    canvas.width = w * dpr; canvas.height = h * dpr;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#0d1420";
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "rgba(255,255,255,0.06)";
    for (let i = 1; i < 12; i++) { ctx.beginPath(); ctx.moveTo((i * w) / 12, 0); ctx.lineTo((i * w) / 12, h); ctx.stroke(); }
    for (let i = 1; i < 6; i++) { ctx.beginPath(); ctx.moveTo(0, (i * h) / 6); ctx.lineTo(w, (i * h) / 6); ctx.stroke(); }

    canvas._points = [];
    Object.values(state.countries).forEach((c) => {
      const { x, y } = project(c.lat, c.lon, w, h);
      const isPlayer = c.id === state.playerCountryId;
      const rel = isPlayer ? 100 : Diplomacy.getValue(state, state.playerCountryId, c.id);
      const r = isPlayer ? 4.5 : Math.max(1.6, Math.min(3.6, Math.log10(c.economy.gdp + 1) * 1.1));
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = isPlayer ? "#C9A24B" : relColor(rel);
      ctx.fill();
      if (isPlayer) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke(); }
      canvas._points.push({ x, y, id: c.id });
    });
  }

  UI.Screens.mundo = {
    render(state) {
      const continents = ["Todos", "África", "Américas", "Ásia", "Europa", "Oceania"];
      return `
        <div class="panel">
          <div class="panel-title">Mapa mundial</div>
          <canvas id="world-map" class="chart-canvas map"></canvas>
          <div class="map-legend">
            <span><i class="dot" style="background:#D9645F"></i>Hostil</span>
            <span><i class="dot" style="background:#8B93A7"></i>Neutra</span>
            <span><i class="dot" style="background:#4CAF7D"></i>Amigável</span>
            <span><i class="dot" style="background:#C9A24B"></i>Você/Aliada</span>
          </div>
        </div>
        <div class="panel">
          <input id="world-search" class="country-search" type="text" placeholder="Buscar país..." value="${UI.esc(UI.worldState.search)}" />
          <div class="continent-tabs">
            ${continents.map((c) => `<button class="continent-tab ${UI.worldState.continent === c ? "active" : ""}" data-action="world-filter" data-continent="${c}">${c}</button>`).join("")}
          </div>
          <div id="world-list" class="world-list"></div>
        </div>
      `;
    },
    afterRender(state, container) {
      const canvas = container.querySelector("#world-map");
      drawMap(canvas, state);
      canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left, y = e.clientY - rect.top;
        let best = null, bestDist = 12;
        (canvas._points || []).forEach((p) => {
          const d = Math.hypot(p.x - x, p.y - y);
          if (d < bestDist) { bestDist = d; best = p; }
        });
        if (best) root.WP.UI.Modals.showCountryDetail(state, best.id);
      });
      renderList(state, container);
      container.querySelector("#world-search").addEventListener("input", (e) => {
        UI.worldState.search = e.target.value;
        renderList(state, container);
      });
    },
    onAction(action, el, state) {
      if (action === "world-filter") {
        UI.worldState.continent = el.getAttribute("data-continent");
        UI.renderScreenContent();
      }
    },
  };

  function renderList(state, container) {
    const list = container.querySelector("#world-list");
    const term = UI.worldState.search.trim().toLowerCase();
    let items = Object.values(state.countries).filter((c) => c.id !== state.playerCountryId);
    if (UI.worldState.continent !== "Todos") items = items.filter((c) => c.continent === UI.worldState.continent);
    if (term) items = items.filter((c) => c.namePt.toLowerCase().includes(term));
    items = items.map((c) => ({ c, rel: Diplomacy.get(state, state.playerCountryId, c.id) }));
    items.sort((a, b) => b.rel.value - a.rel.value);
    items = items.slice(0, 60);
    list.innerHTML = items.map(({ c, rel }) => `
      <button class="world-row" data-action="open-country-detail" data-id="${c.id}">
        <span class="wr-flag">${c.flagEmoji}</span>
        <span class="wr-name">${UI.esc(c.namePt)}</span>
        <span class="wr-rel" style="color:${relColor(rel.value)}">${Diplomacy.category(rel.value)}</span>
      </button>`).join("") || `<div class="empty-note">Nenhum país encontrado.</div>`;
  }
})(typeof window !== "undefined" ? window : global);

          <div class="note">Pesquisa avança com o orçamento de Ciência (aba Economia) e de Modernização militar (aba Defesa) - sem desbloqueios instantâneos.</div>
        </div>
        <div class="panel">
          <div class="panel-title">Tecnologia civil</div>
          ${Object.keys(CIV_LABELS).map((k) => bar(CIV_LABELS[k], c.technology.civilian[k])).join("")}
        </div>
        <div class="panel">
          <div class="panel-title">Tecnologia militar</div>
          ${Object.keys(MIL_LABELS).map((k) => bar(MIL_LABELS[k], c.technology.military[k])).join("")}
        </div>
      `;
    },
  };
})(typeof window !== "undefined" ? window : global);


    /* ---- js/ui/modals.js ---- */
    // js/ui/modals.js
(function (root) {
  root.WP = root.WP || {};
  const UI = root.WP.UI;
  const Modals = (UI.Modals = {});
  const Diplomacy = root.WP.Diplomacy;

  function open(html) {
    const root_ = document.getElementById("modal-root");
    root_.innerHTML = `<div class="modal-backdrop" data-action="close-modal"><div class="modal-card" data-stop>${html}</div></div>`;
    root_.style.display = "flex";
  }
  function close() {
    const root_ = document.getElementById("modal-root");
    root_.style.display = "none";
    root_.innerHTML = "";
  }
  Modals.close = close;

  document.addEventListener("click", (e) => {
    if (e.target.matches("[data-action='close-modal']")) close();
  });

  const ACTION_BUTTONS = [
    { key: "tradeAgreement", label: "Acordo comercial" },
    { key: "freeTradeZone", label: "Zona de livre comércio" },
    { key: "nonAggressionPact", label: "Pacto de não agressão" },
    { key: "alliance", label: "Aliança de defesa" },
    { key: "aid", label: "Enviar ajuda" },
    { key: "sanction", label: "Impor sanções" },
    { key: "embargo", label: "Embargo total" },
    { key: "liftSanction", label: "Suspender sanções" },
    { key: "breakRelations", label: "Romper relações" },
  ];

  Modals.showCountryDetail = function (state, countryId) {
    const c = state.countries[countryId];
    if (!c) return;
    const isPlayer = countryId === state.playerCountryId;
    const rel = isPlayer ? null : Diplomacy.get(state, state.playerCountryId, countryId);
    const treaties = (state.treaties || []).filter((t) => t.parties.includes(countryId) && (isPlayer || t.parties.includes(state.playerCountryId)));
    const atWar = !isPlayer && Diplomacy.isAtWarWith(state, state.playerCountryId, countryId);

    open(`
      <div class="modal-header">
        <div>${c.flagEmoji} <b>${UI.esc(c.namePt)}</b></div>
        <button class="modal-close" data-action="close-modal">✕</button>
      </div>
      <div class="kv-grid">
        <div class="kv"><span class="kv-k">Capital</span><span class="kv-v">${UI.esc(c.capital)}</span></div>
        <div class="kv"><span class="kv-k">População</span><span class="kv-v">${UI.fmtPop(c.population)}</span></div>
        <div class="kv"><span class="kv-k">PIB</span><span class="kv-v">${UI.fmtMoney(c.economy.gdp)}</span></div>
        <div class="kv"><span class="kv-k">PIB per capita</span><span class="kv-v">$${Math.round((c.economy.gdp * 1e9) / (c.population * 1e6)).toLocaleString("pt-BR")}</span></div>
        <div class="kv"><span class="kv-k">Crescimento</span><span class="kv-v">${UI.fmtPct(c.economy.growth)}</span></div>
        <div class="kv"><span class="kv-k">Inflação</span><span class="kv-v">${UI.fmtPct(c.economy.inflation)}</span></div>
        <div class="kv"><span class="kv-k">Dívida/PIB</span><span class="kv-v">${UI.fmtPct(c.fiscal.debtToGdp, 0)}</span></div>
        <div class="kv"><span class="kv-k">Forças armadas (índice)</span><span class="kv-v">${c.military.powerIndex || 0}</span></div>
        <div class="kv"><span class="kv-k">Tecnologia</span><span class="kv-v">${c._civTechAvg || Math.round(Object.values(c.technology.civilian).reduce((a, b) => a + b, 0) / 10)}/100</span></div>
        <div class="kv"><span class="kv-k">Estabilidade</span><span class="kv-v">${UI.fmtNum(c.stability)}/100</span></div>
        ${!isPlayer ? `<div class="kv"><span class="kv-k">Relação com meu país</span><span class="kv-v">${rel.value.toFixed(0)} (${Diplomacy.category(rel.value)})</span></div>
        <div class="kv"><span class="kv-k">Comércio bilateral</span><span class="kv-v">${rel.trade.toFixed(0)}/100</span></div>` : ""}
        <div class="kv"><span class="kv-k">Tratados</span><span class="kv-v">${treaties.length ? treaties.map((t) => t.type.replace("_", " ")).join(", ") : "Nenhum"}</span></div>
        <div class="kv"><span class="kv-k">Alianças</span><span class="kv-v">${(c.alliances || []).join(", ") || "Nenhuma"}</span></div>
        <div class="kv"><span class="kv-k">Recursos naturais</span><span class="kv-v">${(c.resources || []).join(", ") || "—"}</span></div>
      </div>
      ${!isPlayer ? `<div class="modal-actions">
        ${ACTION_BUTTONS.map((a) => `<button class="btn-secondary small" data-action="diplo-action" data-key="${a.key}" data-id="${countryId}">${a.label}</button>`).join("")}
        ${atWar
          ? `<button class="btn-secondary small" data-action="negotiate-peace" data-id="${countryId}">Negociar paz</button>`
          : `<button class="btn-danger small" data-action="declare-war" data-id="${countryId}">Declarar guerra</button>`}
      </div>
      <div class="panel-title" style="margin-top:14px">🕵 Espionagem (${Math.round(state.countries[state.playerCountryId].espionage.points)} pts disponíveis)</div>
      <div class="modal-actions">
        ${Object.keys(root.WP.Espionage.OPS).map((k) => {
          const op = root.WP.Espionage.OPS[k];
          if (op.requiresWar && !atWar) return "";
          return `<button class="btn-secondary small" data-action="espionage-op" data-key="${k}" data-id="${countryId}" title="${UI.esc(op.desc)}">${op.label} (${op.cost} pts)</button>`;
        }).join("")}
      </div>` : ""}
    `);
  };

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.getAttribute("data-action");
    const state = UI.gameState;
    if (!state) return;
    if (action === "diplo-action") {
      const key = el.getAttribute("data-key");
      const id = el.getAttribute("data-id");
      let opts = {};
      if (key === "aid") opts.amount = Math.max(0.1, state.countries[state.playerCountryId].economy.gdp * 0.005);
      Diplomacy.applyAction(state, state.playerCountryId, id, key, opts);
      root.WP.Save.autosave(state);
      UI.toast("Ação diplomática aplicada.");
      Modals.showCountryDetail(state, id);
    } else if (action === "declare-war") {
      const id = el.getAttribute("data-id");
      if (confirm("Declarar guerra a " + state.countries[id].namePt + "? Isso terá consequências econômicas e políticas graves.")) {
        root.WP.War.declare(state, state.playerCountryId, id);
        root.WP.Save.autosave(state);
        close();
        UI.rerender();
      }
    } else if (action === "negotiate-peace") {
      const id = el.getAttribute("data-id");
      const war = (state.wars || []).find((w) => w.active && (w.attackers.includes(id) || w.defenders.includes(id)) && (w.attackers.includes(state.playerCountryId) || w.defenders.includes(state.playerCountryId)));
      if (war) { root.WP.War.negotiatePeace(state, war.id); root.WP.Save.autosave(state); close(); UI.rerender(); }
    } else if (action === "espionage-op") {
      const key = el.getAttribute("data-key");
      const id = el.getAttribute("data-id");
      const result = root.WP.Espionage.performOp(state, state.playerCountryId, id, key);
      if (!result.ok) { UI.toast(result.reason); return; }
      UI.toast(result.success ? "Operação bem-sucedida (chance era " + result.chance + "%)." : "Operação exposta! Relação piorou.");
      root.WP.Save.autosave(state);
      Modals.showCountryDetail(state, id);
    }
  });

  Modals.showEvent = function (state) {
    const active = state.events.active[0];
    if (!active) return;
    open(`
      <div class="modal-header"><div>⚠ ${UI.esc(active.label)}</div></div>
      <div class="note">Uma decisão é necessária antes de continuar avançando o tempo.</div>
      <div class="decision-list">
        ${active.choices.map((c, i) => `
          <button class="decision-card" data-action="resolve-event" data-index="${i}">
            <div class="decision-label">${UI.esc(c.label)}</div>
            <div class="decision-meta">Custo: ${c.cost ? UI.fmtMoney(c.cost) : "nenhum"} · Risco: ${c.risk}</div>
            <div class="decision-effects">Curto prazo: ${(c.shortTerm || []).join("; ")}</div>
            <div class="decision-effects">Longo prazo: ${(c.longTerm || []).join("; ")}</div>
          </button>`).join("")}
      </div>
    `);
  };

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action='resolve-event']");
    if (!el) return;
    const state = UI.gameState;
    root.WP.Events.resolveChoice(state, parseInt(el.getAttribute("data-index"), 10));
    root.WP.Save.autosave(state);
    close();
    UI.rerender();
  });

  Modals.showInstrumentChart = function (state, instrumentId, name) {
    const market = root.WP.Market.ensure(state);
    const history = market.priceHistory[instrumentId] || [];
    const price = market.prices[instrumentId] || 0;
    const high = history.length ? Math.max(...history) : price;
    const low = history.length ? Math.min(...history) : price;
    open(`
      <div class="modal-header"><div>${UI.esc(name)}</div><button class="modal-close" data-action="close-modal">✕</button></div>
      <div class="kv-grid">
        <div class="kv"><span class="kv-k">Preço atual</span><span class="kv-v">${price.toFixed(2)} pts</span></div>
        <div class="kv"><span class="kv-k">Máxima / mínima (histórico)</span><span class="kv-v">${high.toFixed(2)} / ${low.toFixed(2)}</span></div>
      </div>
      <canvas id="instrument-chart" class="chart-canvas"></canvas>
      <div class="note">${history.length < 2 ? "Ainda não há histórico suficiente - volte depois de avançar mais tempo." : "Últimos " + history.length + " meses."}</div>
    `);
    const canvas = document.getElementById("instrument-chart");
    if (canvas && history.length > 1) {
      root.WP.Charts.drawLineChart(canvas, [{ label: name, color: "#4FB7E8", values: history }], history.map((_, i) => "" + i), {});
    }
  };

  Modals.showElection = function (state, won) {
    const r = state.lastElectionResult || {};
    open(`
      <div class="modal-header"><div>${won ? "🗳 Reeleito!" : "🗳 Derrota nas urnas"}</div></div>
      <div class="note">${won ? "Você venceu a eleição e continuará no cargo." : "Sua gestão chegou ao fim - o eleitorado escolheu outro rumo."}</div>
      <div class="kv-grid">
        <div class="kv"><span class="kv-k">Sua pontuação</span><span class="kv-v">${r.incumbentScore}</span></div>
        <div class="kv"><span class="kv-k">Linha de corte</span><span class="kv-v">${r.roll}</span></div>
      </div>
      ${won
        ? `<button class="btn-primary" data-action="close-modal">Continuar governando</button>`
        : `<button class="btn-primary" data-action="election-end-game">Ver resumo do mandato</button>`}
    `);
  };

  document.addEventListener("click", (e) => {
    if (!e.target.matches("[data-action='election-end-game']")) return;
    const state = UI.gameState;
    const c = state.countries[state.playerCountryId];
    open(`
      <div class="modal-header"><div>Fim de mandato — ${UI.esc(c.namePt)}</div></div>
      <div class="kv-grid">
        <div class="kv"><span class="kv-k">Anos no cargo</span><span class="kv-v">${state.time.year - root.WP.Engine.GAME_START_YEAR}</span></div>
        <div class="kv"><span class="kv-k">PIB final</span><span class="kv-v">${UI.fmtMoney(c.economy.gdp)}</span></div>
        <div class="kv"><span class="kv-k">Dívida/PIB final</span><span class="kv-v">${UI.fmtPct(c.fiscal.debtToGdp, 0)}</span></div>
        <div class="kv"><span class="kv-k">Aprovação final</span><span class="kv-v">${UI.fmtNum(c.approval)}</span></div>
      </div>
      <button class="btn-primary" data-action="return-to-menu-final">Voltar ao menu</button>
    `);
  });

  document.addEventListener("click", (e) => {
    if (!e.target.matches("[data-action='return-to-menu-final']")) return;
    close();
    UI.backToMenu();
  });
})(typeof window !== "undefined" ? window : global);
